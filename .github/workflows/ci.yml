name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Bloqueo real en un servidor X virtual: los eventos de xdotool no deben llegar
  # a un segundo cliente mientras dura, y sí después (temporizador, combo, kill -9…).
  xvfb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool
      - run: cargo test --test xvfb -- --ignored

  # Binario estático: debe compilar con musl y no depender de ninguna librería.
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Comprobar que es estático
        run: |
          bin=target/x86_64-unknown-linux-musl/release/nodirt
          file "$bin"
          ldd "$bin" || true
          file "$bin" | grep -q "statically linked"
          "$bin" --version
      - uses: actions/upload-artifact@v7
        with:
          name: nodirt-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/nodirt
